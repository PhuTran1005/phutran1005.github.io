<svg xmlns="http://www.w3.org/2000/svg" width="480" height="798" viewBox="0 0 480 798" role="img" aria-labelledby="title desc">
<title id="title">Dynamic multi-scale window fusion in DW-ViT</title>
<desc id="desc">All fixed-window head groups run in parallel. Their outputs produce input-dependent channel weights through global pooling and an MLP. A weighted sum is expanded from C over G channels to C channels and added to a projected concatenation shortcut. Weights are shared over spatial positions. Window sizes are illustrative.</desc>
