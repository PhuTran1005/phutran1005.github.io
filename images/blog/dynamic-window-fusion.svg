<style>text{font-family:Arial,sans-serif;fill:#34322f} .title{font-size:22px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.tiny{font-size:12.5px}.line{fill:none;stroke:#55534f;stroke-width:1.6;marker-end:url(#arrow)} .box{fill:#f6f2e9;stroke:#d8cdbb;stroke-width:1.2}</style>
